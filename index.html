<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liam Richards — Coming Soon</title>
<meta name="description" content="The most ambitious ancient history quest. Coming soon. Be the first to know.">
<meta property="og:title" content="Liam Richards — Coming Soon">
<meta property="og:description" content="The most ambitious ancient history quest… Be the first to know.">
<meta property="og:image" content="https://liamrichards.co/hero-small.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="preload" href="kailasa.glb" as="fetch" crossorigin>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root {
    --bg: #0b0806;
    --gold: #e2b866;
    --gold-soft: #c9a25a;
    --text: #f3ead9;
    --muted: #b7a88f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100svh;
    overflow-x: hidden;
  }
  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  .scene {
    position: absolute;
    inset: 0;
  }
  .scene img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 70% center;
  }
  .scene::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(90deg, rgba(11,8,6,.92) 0%, rgba(11,8,6,.7) 30%, rgba(11,8,6,0) 55%);
  }
  /* The temple model, placed over the hologram cube in the photo by layoutHologram() */
  model-viewer {
    position: absolute;
    z-index: 1;
    background: transparent;
    --poster-color: transparent;
    --progress-bar-color: transparent;
    filter: drop-shadow(0 0 8px rgba(255, 190, 100, .55)) drop-shadow(0 0 24px rgba(110, 200, 255, .3));
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  model-viewer.ready { opacity: 1; }
  .content {
    position: relative;
    z-index: 2;
    width: min(560px, 100%);
    padding: 48px 16px 48px clamp(16px, 6vw, 96px);
    animation: rise 1.4s ease-out both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  h1 {
    font-family: "Cinzel", serif;
    font-weight: 700;
    font-size: clamp(40px, 6.2vw, 84px);
    line-height: 1;
    letter-spacing: .06em;
    color: var(--gold);
    text-shadow: 0 2px 24px rgba(0,0,0,.6);
  }
  .tagline {
    margin-top: 22px;
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: clamp(22px, 2.4vw, 32px);
    line-height: 1.25;
  }
  .soon {
    margin-top: 18px;
    font-family: "Cinzel", serif;
    font-size: 14px;
    letter-spacing: .4em;
    text-transform: uppercase;
    color: var(--muted);
  }
  form {
    margin-top: 36px;
    display: flex;
    gap: 8px;
    max-width: 440px;
  }
  input[type=email] {
    flex: 1;
    min-width: 0;
    padding: 14px 16px;
    font: inherit;
    font-size: 16px;
    color: var(--text);
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(226,184,102,.35);
    border-radius: 6px;
    outline: none;
    transition: border-color .2s, background .2s;
  }
  input[type=email]::placeholder { color: #8f826d; }
  input[type=email]:focus { border-color: var(--gold); background: rgba(255,255,255,.1); }
  button {
    padding: 14px 20px;
    font: inherit;
    font-weight: 500;
    font-size: 15px;
    color: #1a1208;
    background: var(--gold);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .2s, transform .1s;
  }
  button:hover { background: #f0c97a; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .6; cursor: wait; }
  .note { margin-top: 12px; font-size: 13px; color: var(--muted); min-height: 1.4em; }
  .note.ok { color: var(--gold); }
  .note.err { color: #e98b6f; }

  /* Phones and narrow tablets: show the photo cropped to Liam and the model, text underneath */
  @media (max-width: 900px) {
    .hero { align-items: flex-end; }
    .scene img {
      inset: auto;
      top: 0;
      left: -106vw;
      width: 228vw;
      height: auto;
      object-fit: fill;
    }
    .scene::after {
      background: linear-gradient(180deg, rgba(11,8,6,0) 0, rgba(11,8,6,0) calc(127vw - 160px), rgba(11,8,6,.92) calc(127vw - 20px), var(--bg) calc(127vw + 1px));
    }
    .content { padding: calc(127vw - 70px) 16px 40px; }
    form { flex-direction: column; }
    button { padding: 15px; }
  }
</style>
</head>
<body>
  <main class="hero">
    <div class="scene">
      <img id="photo" src="hero.jpg" width="2400" height="1339" alt="Liam Richards as a gleeful mad scientist holding a glowing hologram of the Kailasa temple">
      <model-viewer id="temple" src="kailasa.glb" alt="3D model of the Kailasa temple, slowly turning"
        auto-rotate auto-rotate-delay="0" rotation-per-second="18deg"
        camera-controls disable-zoom disable-pan disable-tap touch-action="pan-y" interaction-prompt="none"
        camera-orbit="35deg 66deg 78%" field-of-view="28deg"
        environment-image="legacy" tone-mapping="aces" exposure="0.6" shadow-intensity="0"></model-viewer>
    </div>
    <div class="content">
      <h1>Liam<br>Richards</h1>
      <p class="tagline">The most ambitious ancient history quest…</p>
      <p class="soon">Coming soon</p>
      <!-- Kit form "liamrichards.co waitlist" -->
      <form id="signup" action="https://app.kit.com/forms/10131308/subscriptions" method="post">
        <input type="email" name="email_address" placeholder="Your email" aria-label="Email address" required autocomplete="email">
        <button type="submit">Be the first to know</button>
      </form>
      <p class="note" id="note" role="status">No spam. Just the big reveal.</p>
    </div>
  </main>
<script>
  // Where the empty hologram cube sits in hero.jpg, as fractions of the image.
  const HOLO = { x: 0.637, y: 0.43, size: 0.25 };
  const photo = document.getElementById("photo");
  const temple = document.getElementById("temple");

  function layoutHologram() {
    const box = photo.getBoundingClientRect();
    const scene = photo.parentElement.getBoundingClientRect();
    let w = box.width, h = box.height, left = box.left, top = box.top;
    const style = getComputedStyle(photo);
    if (style.objectFit === "cover") {
      const iw = photo.naturalWidth || 2400, ih = photo.naturalHeight || 1339;
      const scale = Math.max(box.width / iw, box.height / ih);
      const [px, py] = style.objectPosition.split(" ").map((v) => parseFloat(v) / 100);
      w = iw * scale;
      h = ih * scale;
      left += (box.width - w) * px;
      top += (box.height - h) * py;
    }
    const size = w * HOLO.size;
    temple.style.width = temple.style.height = size + "px";
    temple.style.left = left - scene.left + w * HOLO.x - size / 2 + "px";
    temple.style.top = top - scene.top + h * HOLO.y - size / 2 + "px";
  }
  addEventListener("resize", layoutHologram);
  photo.complete ? layoutHologram() : photo.addEventListener("load", layoutHologram);
  layoutHologram();
  // Recolour the dark basalt as warm sandstone so the carving reads against the candlelit photo.
  temple.addEventListener("load", () => {
    for (const m of temple.model.materials) {
      m.pbrMetallicRoughness.setBaseColorFactor([0.78, 0.48, 0.2, 1]);
      m.pbrMetallicRoughness.setMetallicFactor(0);
      m.pbrMetallicRoughness.setRoughnessFactor(0.85);
    }
    temple.classList.add("ready");
  });

  const form = document.getElementById("signup");
  const note = document.getElementById("note");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const button = form.querySelector("button");
    button.disabled = true;
    note.className = "note";
    note.textContent = "Adding you…";
    try {
      const res = await fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: { Accept: "application/json" },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || (data.status && data.status !== "success")) {
        throw new Error(data.errors?.messages?.[0] || "");
      }
      form.reset();
      note.className = "note ok";
      note.textContent = "You're in. Check your inbox to confirm.";
    } catch (err) {
      note.className = "note err";
      note.textContent = err.message || "Something went wrong. Please try again.";
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
