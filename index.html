<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liam Richards — Coming Soon</title>
<meta name="description" content="The most ambitious ancient history quest. Coming soon. Be the first to know.">
<meta property="og:title" content="Liam Richards — Coming Soon">
<meta property="og:description" content="The most ambitious ancient history quest… Be the first to know.">
<meta property="og:image" content="https://liamrichards.co/hero-small.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0806;
    --gold: #e2b866;
    --gold-soft: #c9a25a;
    --text: #f3ead9;
    --muted: #b7a88f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100svh;
    overflow-x: hidden;
  }
  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  .scene {
    position: absolute;
    inset: 0;
  }
  .scene img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 70% center;
  }
  .scene::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(90deg, rgba(11,8,6,.92) 0%, rgba(11,8,6,.7) 30%, rgba(11,8,6,0) 55%);
  }
  .content {
    position: relative;
    z-index: 2;
    width: min(560px, 100%);
    padding: 48px 16px 48px clamp(16px, 6vw, 96px);
    animation: rise 1.4s ease-out both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  h1 {
    font-family: "Cinzel", serif;
    font-weight: 700;
    font-size: clamp(40px, 6.2vw, 84px);
    line-height: 1;
    letter-spacing: .06em;
    color: var(--gold);
    text-shadow: 0 2px 24px rgba(0,0,0,.6);
  }
  .tagline {
    margin-top: 22px;
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: clamp(22px, 2.4vw, 32px);
    line-height: 1.25;
  }
  .soon {
    margin-top: 18px;
    font-family: "Cinzel", serif;
    font-size: 14px;
    letter-spacing: .4em;
    text-transform: uppercase;
    color: var(--muted);
  }
  form {
    margin-top: 36px;
    display: flex;
    gap: 8px;
    max-width: 440px;
  }
  input[type=email] {
    flex: 1;
    min-width: 0;
    padding: 14px 16px;
    font: inherit;
    font-size: 16px;
    color: var(--text);
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(226,184,102,.35);
    border-radius: 6px;
    outline: none;
    transition: border-color .2s, background .2s;
  }
  input[type=email]::placeholder { color: #8f826d; }
  input[type=email]:focus { border-color: var(--gold); background: rgba(255,255,255,.1); }
  button {
    padding: 14px 20px;
    font: inherit;
    font-weight: 500;
    font-size: 15px;
    color: #1a1208;
    background: var(--gold);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .2s, transform .1s;
  }
  button:hover { background: #f0c97a; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .6; cursor: wait; }
  .note { margin-top: 12px; font-size: 13px; color: var(--muted); min-height: 1.4em; }
  .note.ok { color: var(--gold); }
  .note.err { color: #e98b6f; }

  /* Phones held sideways: keep the side-by-side layout but tighten it to fit a short screen */
  @media (max-height: 520px) and (orientation: landscape) {
    .content { padding-top: 16px; padding-bottom: 16px; }
    h1 { font-size: 34px; }
    .tagline { margin-top: 10px; font-size: 20px; }
    .soon { margin-top: 8px; font-size: 12px; }
    form { margin-top: 16px; }
    input[type=email], button { padding: 10px 14px; }
    .note { margin-top: 6px; }
  }

  /* Phones upright and narrow tablets: photo cropped to Liam and the model, text underneath */
  @media (max-width: 900px) and (orientation: portrait) {
    .hero { align-items: flex-end; }
    .scene img {
      inset: auto;
      top: 0;
      left: -106vw;
      width: 228vw;
      height: auto;
      object-fit: fill;
    }
    .scene::after {
      background: linear-gradient(180deg, rgba(11,8,6,0) 0, rgba(11,8,6,0) calc(127vw - 160px), rgba(11,8,6,.92) calc(127vw - 20px), var(--bg) calc(127vw + 1px));
    }
    .content { padding: calc(127vw - 70px) 16px 40px; }
    form { flex-direction: column; }
    button { padding: 15px; }
  }
</style>
</head>
<body>
  <main class="hero">
    <div class="scene">
      <img src="hero.jpg" width="2400" height="1339" alt="Liam Richards as a mad scientist holding a glowing model of the Kailasa temple">
    </div>
    <div class="content">
      <h1>Liam<br>Richards</h1>
      <p class="tagline">The most ambitious ancient history quest…</p>
      <p class="soon">Coming soon</p>
      <!-- Kit form "liamrichards.co waitlist" -->
      <form id="signup" action="https://app.kit.com/forms/10131308/subscriptions" method="post">
        <input type="email" name="email_address" placeholder="Your email" aria-label="Email address" required autocomplete="email">
        <button type="submit">Be the first to know</button>
      </form>
      <p class="note" id="note" role="status">No spam. Just the big reveal.</p>
    </div>
  </main>
<script>
  const form = document.getElementById("signup");
  const note = document.getElementById("note");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const button = form.querySelector("button");
    button.disabled = true;
    note.className = "note";
    note.textContent = "Adding you…";
    try {
      const res = await fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: { Accept: "application/json" },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || (data.status && data.status !== "success")) {
        throw new Error(data.errors?.messages?.[0] || "");
      }
      form.reset();
      note.className = "note ok";
      note.textContent = "You're in. Check your inbox to confirm.";
    } catch (err) {
      note.className = "note err";
      note.textContent = err.message || "Something went wrong. Please try again.";
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
